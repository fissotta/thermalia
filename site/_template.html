<title>Thermalia Mapa Vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una sola pantalla; el mapa (canvas) llena todo; paneles flotan encima. Dark-first: Chile visto desde arriba, de noche y de día. */
:root{
  --bg:#0b1420; --fg:#e8eef2; --muted:#9fb0bd; --panel:rgba(14,24,36,.86); --line:rgba(159,176,189,.22);
  --calor:#ff9a3c; --vapor:#ffd9a8; --agua:#4fb3d9; --tierra:#c9a86a; --bosque:#4d7a4f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#eef3f5; --fg:#132130; --muted:#4e6273; --panel:rgba(255,255,255,.9); --line:rgba(19,33,48,.16); color-scheme:light } }
:root[data-theme="light"]{ --bg:#eef3f5; --fg:#132130; --muted:#4e6273; --panel:rgba(255,255,255,.9); --line:rgba(19,33,48,.16); color-scheme:light }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#map.grabbing{cursor:grabbing}
.ui{position:absolute;z-index:5;pointer-events:none}
.ui > *{pointer-events:auto}
#top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.2vw,24px);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{font-weight:400;color:var(--muted);font-size:.7em;margin-left:.5em}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:4px 6px;border-radius:6px}
.crumbs button:hover,.crumbs button:focus-visible{background:var(--line);outline:none}
.crumbs span.sep{opacity:.5}
.ctl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
.btn[aria-pressed="true"]{background:var(--calor);color:#1a0d00;border-color:transparent}
.btn:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
#side{right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));top:auto;width:min(380px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(10px);font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:10px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
#side.hidden{transform:translateY(20px);opacity:0;pointer-events:none}
#side h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
#side h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px;font-weight:700}
#side p{margin:0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.m{border-style:solid;border-color:var(--calor);color:var(--calor)}
.tag.d{border-style:dashed}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.kv div{min-width:0}
.kv b{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;padding:6px 10px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--calor)}
.acciones{display:flex;flex-wrap:wrap;gap:6px}
.acciones a{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg);text-decoration:none;background:transparent}
.acciones a:hover,.acciones a:focus-visible{border-color:var(--agua);outline:none}
.acciones a.pri{background:var(--calor);color:#1a0d00;border-color:transparent}
#legend{left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;backdrop-filter:blur(10px);width:min(300px,calc(100vw - 32px));max-height:min(62vh,560px);overflow:auto;display:flex;flex-direction:column;gap:8px}
#legend label{display:flex;gap:6px;align-items:center}
#legend h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.capas{display:flex;flex-wrap:wrap;gap:5px}
.capa{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:5px 9px 5px 6px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.capa svg{width:14px;height:14px;flex:none}
.capa[aria-pressed="true"]{background:rgba(255,154,60,.16);border-color:var(--calor);color:var(--fg)}
.capa:hover,.capa:focus-visible{border-color:var(--agua);outline:none}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{border-top:1px solid var(--line);padding-top:6px}
.leg b{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.leg b svg{width:12px;height:12px}
.leg div.it{display:flex;align-items:center;gap:6px;line-height:1.5}
.leg div.it svg{width:12px;height:12px;flex:none}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* Galería de fotos de la ficha */
.gal{position:relative;border-radius:12px;overflow:hidden;background:#0a141e;height:200px;flex:none}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s}
.gal img.fade{opacity:0}
.galb{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.42);color:#fff;font-size:20px;line-height:30px;text-align:center;cursor:pointer;backdrop-filter:blur(4px);padding:0}
.galb:hover,.galb:focus-visible{background:rgba(0,0,0,.65);outline:none}
.galb.prev{left:8px}.galb.next{right:8px}
.galdots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px}
.galdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.38);display:block;transition:background .2s,transform .2s}
.galdots i.on{background:#fff;transform:scale(1.25)}
.galcap{position:absolute;left:0;right:0;top:0;padding:6px 10px;font-size:11px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent);text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;justify-content:space-between;gap:8px}
.galcap a{color:#fff;text-decoration:none;opacity:.9}
.galcap .src{opacity:.85;white-space:nowrap}
.acciones a.on{background:var(--calor);color:#1a0d00;border-color:transparent;font-weight:700}
.acciones a.near{border-color:var(--calor);color:var(--calor)}
.acciones span.off{display:inline-flex;align-items:center;font-size:12px;padding:6px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.acciones .star{font-size:11px;opacity:.85;margin-left:2px}
#status{left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 58px);font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;backdrop-filter:blur(8px);max-width:min(320px,calc(100vw - 32px))}
#status b{color:var(--fg);font-weight:700}
/* Buscador: barra pequeña y translúcida en la esquina superior derecha; se vuelve opaca al usarla */
#buscar{right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);width:min(300px,calc(100vw - 32px))}
#buscar .caja{display:flex;align-items:center;gap:6px;background:rgba(14,24,36,.42);border:1px solid rgba(159,176,189,.25);border-radius:999px;padding:5px 10px 5px 12px;backdrop-filter:blur(8px);transition:background .25s,border-color .25s,box-shadow .25s}
#buscar.on .caja,#buscar .caja:hover{background:var(--panel);border-color:var(--line)}
#buscar.on .caja{box-shadow:0 6px 24px rgba(0,0,0,.25);border-color:var(--agua)}
#buscar input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-size:13px;outline:none}
#buscar input::placeholder{color:var(--muted)}
#buscar svg{width:14px;height:14px;color:var(--muted);flex:none}
#sug{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#sug:empty{display:none}
#sug button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:inherit;font-size:13px;text-align:left;padding:7px 12px;cursor:pointer}
#sug button:hover,#sug button[aria-selected="true"]{background:rgba(255,154,60,.16)}
#sug button small{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
#sug button i{font-style:normal;width:16px;text-align:center;color:var(--calor)}
#attrib{right:max(8px,env(safe-area-inset-right,0px));bottom:max(4px,env(safe-area-inset-bottom,0px));font-size:10px;color:rgba(232,238,242,.75);background:rgba(8,14,24,.45);padding:2px 6px;border-radius:6px;z-index:4}
a{color:var(--agua)}
ul.list{margin:0;padding-left:18px}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:640px){ #legend{display:none} #side{max-height:52vh} }
@media (prefers-reduced-motion: reduce){ #side{transition:none} }
</style>

<div id="stage">
  <canvas id="map" aria-label="Mapa vivo de las termas de Chile"></canvas>
  <div class="ui" id="top">
    <h1>Thermalia <small>mapa vivo · prototipo</small></h1>
    <nav class="crumbs" id="crumbs" aria-label="Navegación"></nav>
    <div class="ctl">
      <button class="btn" id="bDia" aria-pressed="false" title="Fijar luz de día">Siempre de día</button>
      <button class="btn" id="bNoche" aria-pressed="false" title="Ver de noche">Ver de noche</button>
      <button class="btn" id="bEstilo" aria-pressed="false" title="Cambiar entre imagen satelital y relieve ilustrado">Relieve</button>
      <button class="btn" id="bSon" aria-pressed="true" title="Ambiente: agua, viento, aves">Sonido</button>
      <button class="btn" id="bMus" aria-pressed="true" title="Música suave generada: pentatónica andina, quena, gotas de agua">Música</button>
    </div>
  </div>
  <div class="ui" id="status"></div>
  <div class="ui" id="buscar"><div class="caja"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><input id="q" type="search" placeholder="Buscar terma, localidad o zona…" autocomplete="off" spellcheck="false" aria-label="Buscar"></div><div id="sug" role="listbox"></div></div>
  <div class="ui" id="legend">
    <h4>Capas <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">(elige una o varias)</span></h4>
    <div class="capas" id="capasBtns"></div>
    <div class="legs" id="legItems"></div>
    <label><input type="checkbox" id="chkExtra"> Mostrar capas mencionada e histórica</label>
    <div class="hint">Cada capa tiene su propio símbolo; el color indica el valor. Borde continuo = dato medido · discontinuo = declarado.</div>
  </div>
  <aside class="ui hidden" id="side" aria-live="polite"></aside>
  <div class="ui" id="attrib">Imágenes © Esri, Maxar, Earthstar Geographics · Relieve © Esri, USGS, NOAA</div>
</div>

<script id="data-termas" type="application/json">__TERMAS__</script>
<script id="data-chile" type="application/json">__CHILE__</script>
<script>
(function(){
'use strict';
const TERMAS = JSON.parse(document.getElementById('data-termas').textContent);
const CHILE = JSON.parse(document.getElementById('data-chile').textContent);
const canvas = document.getElementById('map'); const ctx = canvas.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

/* ---------- Zonas (geografía y cultura, no regiones) ---------- */
const ZONAS = [
 {id:1,n:'Altiplano y precordillera aymara',lat:[-21.5,-17.5],c:[-19.3,-69.4],pueblo:'aymara',bioma:'altiplano',
  txt:'Volcanes de más de 6.000 m, salares, bofedales y rebaños de llamas y alpacas. Aguas sobre todo cloruradas sódicas de origen volcánico (Jurasi, Surire, Puchuldiza, Chusmiza). Derechos ancestrales de agua reconocidos a comunidades aymaras (Chusmiza 2009, Putre 2020).'},
 {id:2,n:'Puna lickanantay y desierto de Atacama',lat:[-26,-21.5],c:[-23.3,-68.4],pueblo:'lickanantay',bioma:'puna',
  txt:'El Tatio, con más de 200 manifestaciones y la terma más estudiada del país, Puritama, Láscar y Lastarria. Aguas Na-Cl maduras con arsénico muy alto. El Tatio lo administran las comunidades de Toconce y Caspana desde 2014.'},
 {id:3,n:'Norte Chico',lat:[-32.2,-26],c:[-28.5,-70.2],pueblo:'colla y diaguita',bioma:'semiarido',
  txt:'Laguna Verde y Juncalito en la cordillera de Copiapó, Socos en el Limarí. Pocas termas y poco estudiadas; desierto florido en años lluviosos.'},
 {id:4,n:'Chile central y Cordillera',lat:[-36.3,-32.2],c:[-34.2,-70.6],pueblo:'picunche / frontera inca',bioma:'mediterraneo',
  txt:'Las termas históricas del país: Jahuel, Colina, Cauquenes (Darwin 1834), Panimávida, Catillo. Dos familias de agua: bicarbonatadas de las fallas Pocuro y cloruradas del cordón volcánico (Tupungatito, Tinguiririca, Planchón).'},
 {id:5,n:'Ñuble, Biobío y Araucanía andina',lat:[-39.5,-36.3],c:[-38,-71.6],pueblo:'pewenche y mapuche',bioma:'araucaria',
  txt:'Nevados de Chillán, Copahue y Chancho Ko, Tolhuaca, Villarrica. Aguas ácido-sulfatadas calentadas por vapor junto a los volcanes y cloruradas sódicas sobre la falla Liquiñe-Ofqui. Único territorio con termas administradas por comunidades pewenche (Nitrao, Kokiyen).'},
 {id:6,n:'Zona lacustre y Patagonia norte',lat:[-44.5,-39.5],c:[-41.3,-72.6],pueblo:'mapuche-huilliche',bioma:'valdiviano',
  txt:'La mayor concentración de termas de Sudamérica: Liquiñe, Coñaripe, Geométricas, Puyehue y Aguas Calientes, Cahuelmó y Porcelana en el fiordo Comau. Lluvia, selva valdiviana y volcanes.'},
 {id:7,n:'Aysén',lat:[-49,-44.5],c:[-46.2,-72.8],pueblo:'chono-kawésqar y colonos',bioma:'patagonia',
  txt:'Puyuhuapi, Ventisquero, Quitralco y las 25 fuentes que Hauser catastró al construir la Carretera Austral (1989): aguas cloruradas sódicas mezcladas con el fiordo, sobre la falla Liquiñe-Ofqui.'},
 {id:8,n:'Magallanes',lat:[-56,-49],c:[-52.5,-71.5],pueblo:'kawésqar y estancieros',bioma:'estepa',
  txt:'Termas de Skyring, cerca de Río Verde, y casi ningún dato científico publicado. Estepa, ovejas y viento.'}
];
const zoneOf = id => ZONAS.find(z=>z.id===id);

/* ---------- Proyección y cámara ---------- */
const cam = {lat:-37.5, lon:-71.2, s: 0, target:null, t0:0, from:null, dur:1200};
/* Proyección Web Mercator: cam.s = píxeles por grado de longitud (coincide con las teselas de mapa). */
const R2D=180/Math.PI, D2R=Math.PI/180;
const mY=lat=>Math.log(Math.tan(Math.PI/4+Math.max(-85,Math.min(85,lat))*D2R/2))*R2D; // "grados" mercator
const mLat=y=>(2*Math.atan(Math.exp(y*D2R))-Math.PI/2)*R2D;
function fitChile(){ const s=Math.min(H/(mY(-17.5)-mY(-56)+2), W/15); return {lat:mLat((mY(-17.5)+mY(-56))/2), lon:-70.8, s:s}; }
function proj(lat,lon){ return [W/2 + (lon-cam.lon)*cam.s, H/2 - (mY(lat)-mY(cam.lat))*cam.s]; }
function unproj(x,y){ return [mLat(mY(cam.lat) - (y-H/2)/cam.s), cam.lon + (x-W/2)/cam.s]; }
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function flyTo(lat,lon,s,dur){ cam.from={lat:cam.lat,lon:cam.lon,s:cam.s}; cam.target={lat,lon,s}; cam.t0=performance.now(); cam.dur=reduced?0:(dur||1300); }
function stepCam(now){ if(!cam.target) return; const k=cam.dur?Math.min(1,(now-cam.t0)/cam.dur):1, e=ease(k); cam.lat=cam.from.lat+(cam.target.lat-cam.from.lat)*e; cam.lon=cam.from.lon+(cam.target.lon-cam.from.lon)*e; cam.s=cam.from.s+(cam.target.s-cam.from.s)*e; if(k>=1) cam.target=null; }

/* ---------- Estado de navegación ---------- */
let nivel=0, zonaSel=null, termaSel=null;
const crumbs=document.getElementById('crumbs'), side=document.getElementById('side');
function goChile(){ nivel=0; zonaSel=null; termaSel=null; const f=fitChile(); flyTo(f.lat,f.lon,f.s); renderCrumbs(); side.classList.add('hidden'); }
function goZona(z){ nivel=1; zonaSel=z; termaSel=null; const span=mY(z.lat[1])-mY(z.lat[0]); const s=Math.min(H/(span*1.25), W/9); flyTo(z.c[0],z.c[1],s,1400); renderCrumbs(); renderZona(z); }
function goTerma(t){ nivel=2; termaSel=t; const z=zoneOf(t.z); zonaSel=z||zonaSel; flyTo(t.lat,t.lon,Math.max(cam.s*2.2, Math.min(W,H)*1.6),1200); renderCrumbs(); renderTerma(t); }
function renderCrumbs(){ let h='<button data-go="chile">Chile</button>'; if(zonaSel){h+='<span class="sep">›</span><button data-go="zona">'+zonaSel.n+'</button>';} if(termaSel){h+='<span class="sep">›</span><button data-go="terma">'+termaSel.n+'</button>';} crumbs.innerHTML=h; }
crumbs.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.go==='chile') goChile(); else if(b.dataset.go==='zona') goZona(zonaSel); });

/* ---------- Hora solar real y clima simulado ---------- */
let modoLuz='real'; // real | dia | noche
function solarElev(lat,lon,date){ const d=(date-Date.UTC(date.getUTCFullYear(),0,1))/864e5; const decl=23.44*Math.sin((360/365)*(d-81)*Math.PI/180); const hUTC=date.getUTCHours()+date.getUTCMinutes()/60; const solarH=(hUTC+lon/15)%24; const ha=(solarH-12)*15; const r=Math.PI/180; return Math.asin(Math.sin(lat*r)*Math.sin(decl*r)+Math.cos(lat*r)*Math.cos(decl*r)*Math.cos(ha*r))/r; }
function luz(lat,lon){ if(modoLuz==='dia') return 1; if(modoLuz==='noche') return 0; const e=solarElev(lat,lon,new Date()); return Math.max(0,Math.min(1,(e+6)/18)); }
function estacion(){ const m=new Date().getMonth(); return (m>=11||m<=1)?'verano':(m<=4)?'otoño':(m<=7)?'invierno':'primavera'; }
/* Clima simulado por zona y estación (en producción: Open-Meteo por centro de zona, cada 30 min). */
const climaBase={1:{s:.8,r:.1},2:{s:.95,r:.02},3:{s:.85,r:.08},4:{s:.6,r:.25},5:{s:.45,r:.4},6:{s:.3,r:.55},7:{s:.3,r:.55},8:{s:.35,r:.45}};
const seed=Math.floor(Date.now()/18e5); function rnd(i){ const x=Math.sin(i*9301+seed*49297)*233280; return x-Math.floor(x); }
const clima={}; let climaReal=false;
/* Clima real: Open-Meteo (gratis, sin clave) para el centro de cada zona, cada 30 min; si falla, queda el simulado. */
const WMO={0:'despejado',1:'mayormente despejado',2:'parcial',3:'nublado',45:'niebla',48:'niebla',51:'llovizna',53:'llovizna',55:'llovizna',56:'llovizna helada',57:'llovizna helada',61:'lluvia',63:'lluvia',65:'lluvia intensa',66:'lluvia helada',67:'lluvia helada',71:'nieve',73:'nieve',75:'nieve intensa',77:'nieve',80:'chubascos',81:'chubascos',82:'chubascos fuertes',85:'nieve',86:'nieve',95:'tormenta',96:'tormenta con granizo',99:'tormenta con granizo'};
async function cargarClima(){ try{ const la=ZONAS.map(z=>z.c[0]).join(','), lo=ZONAS.map(z=>z.c[1]).join(',');

    ZONAS.forEach(z=>{ const n=list.filter(t=>t.z===z.id).length; if(!n) return; const [x,y]=projT((z.lat[0]+z.lat[1])/2, z.c[1]); const r=10+Math.sqrt(n)*2.2; const pulse=sereno?1:1+Math.sin(now/900+z.id)*.06; ctx.fillStyle='rgba(255,154,60,.18)'; ctx.beginPath(); ctx.arc(x,y,r*2.2*pulse,0,6.28); ctx.fill(); ctx.fillStyle='rgba(255,154,60,.9)'; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill(); ctx.fillStyle='#1a0d00'; ctx.font='700 13px '+getComputedStyle(document.body).fontFamily; ctx.textAlign='center'; ctx.fillText(n,x,y+4); ctx.textAlign='left'; });
    return; }
  const font=getComputedStyle(document.body).fontFamily;
  list.forEach(t=>{ const [x,y]=projT(t.lat,t.lon); if(x<-24||x>W+24||y<-24||y>H+24) return; const med=t.tm!=null; const big=(t===termaSel)?1.7:(t===hoverTerma?1.35:1); const r=4.6*big;
    // vapor sobre las termas muy calientes
    if(!sereno&&(t.tm||0)>60&&cam.s>60){ const k=(now/40+x)%60; ctx.fillStyle='rgba(255,217,168,'+(.25*(1-k/60))+')'; ctx.beginPath(); ctx.arc(x+Math.sin(now/500+x)*3,y-8-k*.4,3+k*.12,0,6.28); ctx.fill(); }
    // halo cálido (más visible de noche)
    const halo=(act.length>1?10:7)*big; ctx.fillStyle='rgba(255,154,60,'+(l<.4?.33:.14)+')'; ctx.beginPath(); ctx.arc(x,y,halo+r*.8,0,6.28); ctx.fill();
    if(act.length>1){ ctx.fillStyle='rgba(8,14,24,.55)'; ctx.beginPath(); ctx.arc(x,y,halo+1,0,6.28); ctx.fill(); }
    act.forEach((c,i)=>{ const pal=PAL[c[0]]; const col=(pal[claseDe(t,c[0])]||pal.NA||['#6b7a86'])[0]; const o=offs[i]; const gx=x+o[0]*big, gy=y+o[1]*big; const gr=act.length>1?r*.78:r;
      glyphPath(ctx,c[2],gx,gy,gr); ctx.fillStyle=col; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=1.2; ctx.setLineDash(med?[]:[2,2]); glyphPath(ctx,c[2],gx,gy,gr+1.3); ctx.stroke(); ctx.setLineDash([]); });
    if(cam.s>320||t===hoverTerma||t===termaSel){ ctx.font=(t===termaSel?'600 13px ':'12px ')+font; ctx.lineWidth=3; ctx.strokeStyle='rgba(8,14,24,.7)'; ctx.strokeText(t.n,x+halo+6,y+4); ctx.fillStyle='rgba(232,238,242,.95)'; ctx.fillText(t.n,x+halo+6,y+4); }
  });
}

/* ---------- Buscador con autocompletado (termas, comunas, ciudades, lagos, volcanes, zonas) ---------- */
const qIn=document.getElementById('q'), sug=document.getElementById('sug'), buscar=document.getElementById('buscar');
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const INDICE=[];
TERMAS.forEach(t=>{ if(t.lat!=null) INDICE.push({k:'terma',n:t.n,sub:(t.com&&t.com!=='NA'?t.com+' · ':'')+t.reg,go:()=>goTerma(t)}); });
[...new Set(TERMAS.filter(t=>t.com&&t.com!=='NA'&&t.lat!=null).map(t=>t.com))].forEach(c=>{ const ts=TERMAS.filter(t=>t.com===c&&t.lat!=null); const la=ts.reduce((a,t)=>a+t.lat,0)/ts.length, lo=ts.reduce((a,t)=>a+t.lon,0)/ts.length; INDICE.push({k:'comuna',n:c,sub:ts.length+(ts.length===1?' terma':' termas'),go:()=>irA(la,lo,Math.max(cam.s,320))}); });

LAGOS.forEach(L=>INDICE.push({k:'lago',n:L[4],sub:L[3]==='#efe8d6'?'salar':'lago',go:()=>irA(L[0],L[1],Math.max(cam.s,260))}));

function irA(lat,lon,s){ if(nivel===0){ nivel=1; zonaSel=ZONAS.find(z=>lat>=z.lat[0]&&lat<z.lat[1])||ZONAS[4]; renderCrumbs(); renderZona(zonaSel); } flyTo(lat,lon,s,1300); }
const ICO={terma:'♨',comuna:'⌂',ciudad:'●',lago:'◦',volcan:'▲',zona:'▭'};
let sugSel=-1, sugList=[];
function buscarAhora(){ const q=nrm(qIn.value.trim()); sugSel=-1; if(q.length<2){ sug.innerHTML=''; sugList=[]; return; } const pref=INDICE.filter(e=>e.q.startsWith(q)), cont=INDICE.filter(e=>!e.q.startsWith(q)&&e.q.includes(q)); sugList=pref.concat(cont).slice(0,8);
  sug.innerHTML=sugList.map((e,i)=>'<button role="option" data-i="'+i+'"><i>'+ICO[e.k]+'</i><span>'+esc(e.n)+'</span><small>'+esc(e.sub)+'</small></button>').join(''); }

/* ---------- Interacción con el mapa ---------- */
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,lat:cam.lat,lon:cam.lon,moved:false}; canvas.classList.add('grabbing'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; if(drag.moved&&nivel>0){ cam.target=null; const kx=Math.cos(cam.lat*Math.PI/180); cam.lat=mLat(mY(drag.lat)+dy/cam.s); cam.lon=drag.lon-dx/cam.s;} return; }
  const [la,lo]=unproj(e.clientX,e.clientY); hoverZona=nivel===0?ZONAS.find(z=>la>=z.lat[0]&&la<z.lat[1]&&lo>-76&&lo<-66):null; hoverTerma=null; if(nivel>0){ let best=null,bd=12; visibles().forEach(t=>{ const [x,y]=projT(t.lat,t.lon); const d=Math.hypot(x-e.clientX,y-e.clientY); if(d<bd){bd=d;best=t;} }); hoverTerma=best; } canvas.style.cursor=(hoverZona||hoverTerma)?'pointer':(drag?'grabbing':'grab'); });
canvas.addEventListener('pointerup',e=>{ const moved=drag&&drag.moved; drag=null; canvas.classList.remove('grabbing'); if(moved) return; if(nivel===0){ if(hoverZona) goZona(hoverZona); return; } if(hoverTerma) goTerma(hoverTerma); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); cam.target=null; const [la,lo]=unproj(e.clientX,e.clientY); const f=Math.exp(-e.deltaY*.0015); cam.s=Math.max(fitChile().s*.8,Math.min(40000,cam.s*f)); if(nivel===0&&cam.s>fitChile().s*1.6){ nivel=1; zonaSel=ZONAS.find(z=>la>=z.lat[0]&&la<z.lat[1])||ZONAS[4]; renderCrumbs(); renderZona(zonaSel); } const [la2,lo2]=unproj(e.clientX,e.clientY); cam.lat+=la-la2; cam.lon+=lo-lo2; },{passive:false});
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(nivel===2) goZona(zonaSel); else if(nivel===1) goChile(); } });

/* ---------- Sonido sintetizado (sin archivos externos) ---------- */
let AC=null, son=true, nodes={}, audioListo=false;
function startAudio(){ AC=new (window.AudioContext||window.webkitAudioContext)(); const master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); nodes.master=master;
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=buf.getChannelData(0); let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; }
  const agua=AC.createBufferSource(); agua.buffer=buf; agua.loop=true; const fa=AC.createBiquadFilter(); fa.type='lowpass'; fa.frequency.value=900; const ga=AC.createGain(); ga.gain.value=.35; agua.connect(fa).connect(ga).connect(master); agua.start(); nodes.agua=ga;
  const viento=AC.createBufferSource(); viento.buffer=buf; viento.loop=true; const fv=AC.createBiquadFilter(); fv.type='bandpass'; fv.frequency.value=400; fv.Q.value=.6; const gv=AC.createGain(); gv.gain.value=.12; viento.connect(fv).connect(gv).connect(master); viento.start(); nodes.viento=gv; nodes.fv=fv;
  nodes.lfo=AC.createOscillator(); nodes.lfo.frequency.value=.08; const lg=AC.createGain(); lg.gain.value=.08; nodes.lfo.connect(lg).connect(gv.gain); nodes.lfo.start(); }
function chirp(f0,f1,dur,vol){ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; const t=AC.currentTime; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.2); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(nodes.master); o.start(t); o.stop(t+dur+.05); }
let nextChirp=0;
function stepAudio(now){ if(!son||!AC) return; const z=zonaSel; const l=z?luz(z.c[0],z.c[1]):.5; const cl=z?clima[z.id]:{viento:.4,lluvia:false}; nodes.viento.gain.setTargetAtTime(.06+cl.viento*.18,AC.currentTime,.5); nodes.agua.gain.setTargetAtTime(nivel===2?.45:(cl.lluvia?.4:.25),AC.currentTime,.5);
  if(now>nextChirp){ if(l>.4){ const n=1+Math.floor(Math.random()*3); for(let i=0;i<n;i++) setTimeout(()=>chirp(1800+Math.random()*1500,2600+Math.random()*1800,.12+Math.random()*.1,.05),i*140); nextChirp=now+2500+Math.random()*6000; } else { chirp(4200,4000,.05,.025); setTimeout(()=>chirp(4200,4000,.05,.025),90); nextChirp=now+400+Math.random()*900; } } }
document.getElementById('bSon').addEventListener('click',e=>{ son=!son; e.currentTarget.setAttribute('aria-pressed',son); if(son&&!AC) startAudio(); if(AC){ if(son||mus) AC.resume(); else AC.suspend(); } if(AC){ nodes.master.gain.setTargetAtTime(son?.5:0,AC.currentTime,.4); } });

/* ---------- Música generativa: pentatónica andina, lenta, meditativa (síntesis propia) ---------- */
let mus=true, M={}, musTimer=null;
/* Activados por defecto: el navegador solo permite audio tras un gesto, así que arrancan con el primer toque o tecla. */
function primerGesto(){ if(audioListo) return; audioListo=true; if(son||mus){ if(!AC) startAudio(); if(mus) startMusic(); if(!son) nodes.master.gain.value=0; AC.resume(); } }
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,primerGesto,{once:true,passive:true}));
const ESCALA=[146.83,174.61,196.00,220.00,261.63,293.66,349.23,392.00,440.00,523.25]; // re menor pentatónica (re fa sol la do), dos octavas: color andino suave
function startMusic(){ if(!AC) startAudio(); const g=AC.createGain(); g.gain.value=0; g.connect(AC.destination); M.out=g;
  // reverberación: respuesta al impulso generada (cola de 3 s), para sensación de caverna/agua
  const len=AC.sampleRate*3, ir=AC.createBuffer(2,len,AC.sampleRate); for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)*.5; } }
  const conv=AC.createConvolver(); conv.buffer=ir; const wet=AC.createGain(); wet.gain.value=.55; const dry=AC.createGain(); dry.gain.value=.6; M.bus=AC.createGain(); M.bus.connect(dry).connect(g); M.bus.connect(conv).connect(wet).connect(g);
  // bordón grave, muy suave, dos osciladores desafinados con respiración lenta
  M.drone=[0,.6].map(det=>{ const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=73.42; o.detune.value=det; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=220; const dg=AC.createGain(); dg.gain.value=.05; o.connect(f).connect(dg).connect(M.bus); o.start(); const lfo=AC.createOscillator(); lfo.frequency.value=.05+det*.02; const lg=AC.createGain(); lg.gain.value=.02; lfo.connect(lg).connect(dg.gain); lfo.start(); return o; });
  M.t=0; M.ultima=null; programar(); g.gain.setTargetAtTime(.5,AC.currentTime,1.2); }
function quena(f,dur,vol){ const t=AC.currentTime; const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*.985,t); o.frequency.exponentialRampToValueAtTime(f,t+.12); const o2=AC.createOscillator(); o2.type='sine'; o2.frequency.value=f*2; const g2=AC.createGain(); g2.gain.value=.18;
  const vib=AC.createOscillator(); vib.frequency.value=4.5; const vg=AC.createGain(); vg.gain.value=f*.006; vib.connect(vg).connect(o.frequency); // vibrato leve
  const aire=AC.createBufferSource(); aire.buffer=M.aire||(M.aire=(()=>{const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b;})()); aire.loop=true; const af=AC.createBiquadFilter(); af.type='bandpass'; af.frequency.value=f*2.2; af.Q.value=8; const ag=AC.createGain(); ag.gain.value=.04; // soplo
  const env=AC.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(vol,t+.35); env.gain.setValueAtTime(vol,t+dur*.6); env.gain.exponentialRampToValueAtTime(.0001,t+dur+.6);
  const pan=AC.createStereoPanner?AC.createStereoPanner():null; if(pan){ pan.pan.value=(Math.random()-.5)*.6; }
  o.connect(env); o2.connect(g2).connect(env); aire.connect(af).connect(ag).connect(env); if(pan){ env.connect(pan).connect(M.bus); } else env.connect(M.bus);
  o.start(t); o2.start(t); vib.start(t); aire.start(t); o.stop(t+dur+.8); o2.stop(t+dur+.8); vib.stop(t+dur+.8); aire.stop(t+dur+.8); }
function gota(f){ const t=AC.currentTime; const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*2,t); o.frequency.exponentialRampToValueAtTime(f*1.5,t+.25); const env=AC.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(.09,t+.01); env.gain.exponentialRampToValueAtTime(.0001,t+1.4); const pan=AC.createStereoPanner?AC.createStereoPanner():null; if(pan){ pan.pan.value=(Math.random()-.5)*1.2; o.connect(env).connect(pan).connect(M.bus);} else o.connect(env).connect(M.bus); o.start(t); o.stop(t+1.5); }
function kultrun(){ const t=AC.currentTime; const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(48,t+.3); const env=AC.createGain(); env.gain.setValueAtTime(0,t); env.gain.linearRampToValueAtTime(.12,t+.015); env.gain.exponentialRampToValueAtTime(.0001,t+.5); o.connect(env).connect(M.bus); o.start(t); o.stop(t+.6); }
function programar(){ if(!mus) return; const l=zonaSel?luz(zonaSel.c[0],zonaSel.c[1]):luz(-37,-71); const noche=l<.35; const paso=(noche?2600:1900)+Math.random()*2200;
  M.t++; const r=Math.random();
  if(r<.62){ // frase de quena: notas vecinas en la escala, sin saltos grandes
    let i=M.ultima==null?3+Math.floor(Math.random()*4):Math.max(0,Math.min(ESCALA.length-1,M.ultima+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)])); if(noche&&i>6) i-=3; M.ultima=i; const dur=1.2+Math.random()*2.2; quena(ESCALA[i],dur,noche?.11:.15); if(Math.random()<.3) setTimeout(()=>{ if(mus) quena(ESCALA[Math.max(0,i-1)],.6,.08); },(dur*600)); }
  else if(r<.9){ // gotas de agua afinadas (acuático)
    const n=1+Math.floor(Math.random()*3); for(let k=0;k<n;k++) setTimeout(()=>{ if(mus) gota(ESCALA[5+Math.floor(Math.random()*5)]); },k*(180+Math.random()*260)); }
  if(M.t%4===0&&!noche&&Math.random()<.7) kultrun(); else if(noche&&M.t%6===0) kultrun();
  musTimer=setTimeout(programar,paso); }
document.getElementById('bMus').addEventListener('click',e=>{ mus=!mus; e.currentTarget.setAttribute('aria-pressed',mus); if(mus){ if(!AC) startAudio(); if(!M.out) startMusic(); else { M.out.gain.setTargetAtTime(.5,AC.currentTime,1); programar(); } AC.resume(); if(!son) nodes.master.gain.setTargetAtTime(0,AC.currentTime,.1); } else { clearTimeout(musTimer); if(M.out) M.out.gain.setTargetAtTime(0,AC.currentTime,1.2); if(!son&&AC) setTimeout(()=>{ if(!son&&!mus) AC.suspend(); },1800); } });
document.getElementById('bDia').addEventListener('click',e=>{ modoLuz=modoLuz==='dia'?'real':'dia'; e.currentTarget.setAttribute('aria-pressed',modoLuz==='dia'); document.getElementById('bNoche').setAttribute('aria-pressed','false'); });
document.getElementById('bEstilo').addEventListener('click',e=>{ estilo=estilo==='sat'?'relieve':'sat'; e.currentTarget.setAttribute('aria-pressed',estilo==='relieve'); e.currentTarget.textContent=estilo==='sat'?'Relieve':'Satélite'; });
document.getElementById('bNoche').addEventListener('click',e=>{ modoLuz=modoLuz==='noche'?'real':'noche'; e.currentTarget.setAttribute('aria-pressed',modoLuz==='noche'); document.getElementById('bDia').setAttribute('aria-pressed','false'); });

const status=document.getElementById('status');
let last=performance.now(), spawnT=0, statusT=0;
function frame(now){ const dt=Math.min(50,now-last); last=now; stepCam(now);
  const lz=zonaSel?luz(zonaSel.c[0],zonaSel.c[1]):luz(-37,-71);
  // cielo/mar
  const sky=ctx.createLinearGradient(0,0,0,H); const d=lz; sky.addColorStop(0,'rgb('+Math.round(8+40*d)+','+Math.round(20+70*d)+','+Math.round(40+90*d)+')'); sky.addColorStop(1,'rgb('+Math.round(10+30*d)+','+Math.round(28+60*d)+','+Math.round(50+80*d)+')'); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  drawChile(lz); drawZonas(lz); drawTermas(now,lz);
  if(nivel>0){ spawnT+=dt; if(spawnT>(nivel===2?1800:900)){ spawnT=0; spawn(zonaSel); } if(sprites.length<6&&zonaSel){ for(let i=0;i<4;i++) spawn(zonaSel); } for(let i=sprites.length-1;i>=0;i--){ if(!drawSprite(sprites[i],now,dt)) sprites.splice(i,1); } }
  drawClima(now,dt,lz); drawSol(lz); drawLuz();
  stepAudio(now);
  statusT+=dt; if(statusT>1000){ statusT=0; const h=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',timeZone:'America/Santiago'}); const z=zonaSel; status.innerHTML=(audioListo||(!son&&!mus)?'':'<b>Toca el mapa para activar sonido y música.</b><br>')+'<b>'+h+'</b> hora de Chile · luz '+(modoLuz==='real'?'real':modoLuz)+' · '+estacion()+(z?' · <b>'+esc(z.n)+'</b>: '+clima[z.id].temp+' °C, '+clima[z.id].txt+(clima[z.id].real?' (real)':' (simulado)'):' · '+visibles().length+' sitios termales en el mapa'); }
  requestAnimationFrame(frame); }
goChile(); cam.lat=-37.2; cam.lon=-70.8; cam.s=fitChile().s; cam.target=null; renderCrumbs();
status.textContent='Cargando…'; requestAnimationFrame(frame);
chkExtra.addEventListener('change',()=>{ if(nivel===1) renderZona(zonaSel); });
})();
